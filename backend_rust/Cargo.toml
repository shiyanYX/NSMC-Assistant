[package]
name = "backend_rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
actix-web = "4"
actix-cors = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
scraper = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.10"
regex = "1.12.4"
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
encoding_rs = "0.8"
once_cell = "1.19"
jni = { version = "0.21", optional = true }

[features]
android-jni = ["jni"]
